<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner Multiplayer - Socket.io</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <main class="game-area">
            <header class="game-header">
                <div>
                    <h1>Dino Runner Multiplayer</h1>
                    <p class="subtitle">Sobreviva no deserto com seus amigos em tempo real</p>
                </div>

                <div class="header-actions">
                    <span id="connectionStatus" class="status-pill">Conectando...</span>
                    <button id="focusModeBtn" type="button" class="icon-btn" title="Alternar visibilidade dos outros jogadores na pista">
                        👀 Todos
                    </button>
                    <button id="muteBtn" type="button" class="icon-btn" title="Ativar ou silenciar som">
                        🔊 Som
                    </button>
                </div>
            </header>

            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="900" height="300"></canvas>
            </div>

            <div class="controls-bar">
                <p class="controls">
                    <strong>Espaço / ↑ / W</strong> Pular &nbsp;|&nbsp;
                    <strong>↓ / S</strong> Abaixar (ou queda rápida no ar)
                </p>

                <div class="touch-controls">
                    <button id="jumpBtn" type="button" class="action-btn">⬆ Pular</button>
                    <button id="duckBtn" type="button" class="action-btn secondary">⬇ Abaixar</button>
                </div>
            </div>
        </main>

        <aside class="scoreboard">
            <div class="record-box">
                <span class="record-label">Recorde da Sala</span>
                <strong id="highScoreValue">00000</strong>
            </div>

            <div class="network-box">
                <div class="network-header">
                    <span class="record-label">IP Local e Porta</span>
                    <div class="network-actions">
                        <button id="toggleQrBtn" type="button" class="copy-btn" title="Exibir ou ocultar QR Code">
                            QR Code
                        </button>
                        <button id="copyUrlBtn" type="button" class="copy-btn" title="Copiar endereço da rede">
                            Copiar
                        </button>
                    </div>
                </div>
                <strong id="localIpValue">Detectando...</strong>
                <span id="localPortValue" class="network-port">Porta: --</span>
                <span id="localUrlValue" class="network-url"></span>
                <div id="qrContainer" class="qr-container hidden">
                    <img id="qrImage" alt="QR Code para acessar o jogo na rede local" width="160" height="160">
                    <span id="qrStatus" class="qr-hint">Escaneie no celular na mesma rede Wi-Fi</span>
                </div>
            </div>

            <form id="nameForm" class="name-form">
                <label for="playerNameInput">Seu Apelido</label>
                <div class="name-input-group">
                    <input id="playerNameInput" type="text" maxlength="14" placeholder="Ex: T-Rex" autocomplete="off">
                    <button id="saveNameBtn" type="submit">OK</button>
                </div>
            </form>

            <h2>Corredores</h2>
            <ul id="scoreList"></ul>
        </aside>
    </div>

    <!-- Biblioteca cliente do Socket.io servida automaticamente pelo Express -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>

</html>
